<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<title>02 / Titre du projet 02</title>

<!-- Toute la page est construite par assets/projet.js.
     Il n'y a ici QUE les données propres à ce projet : c'est le seul
     bloc à modifier. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/holo.css?v=61">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  html,body{height:100%;overflow:hidden}
  #accueil{position:fixed;inset:0;z-index:10;overflow-y:auto}

  #etat{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
    padding:15px 20px calc(15px + env(safe-area-inset-bottom));
    background:rgba(3,8,15,.80);backdrop-filter:blur(12px);
    border-top:1px solid var(--beton-clair);
    text-align:center;font-size:11px;letter-spacing:.06em;color:var(--gris-archive);
  }
  #etat.visible{display:block}
  #etat b{color:var(--blanc-casse);font-weight:400}

  #quitter,#retour{
    position:fixed;top:calc(12px + env(safe-area-inset-top));z-index:26;
    cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.05em;
    background:rgba(3,8,15,.80);backdrop-filter:blur(12px);
    border:1px solid var(--beton-clair);border-radius:1px;
    color:var(--gris-archive);padding:10px 15px;
  }
  #quitter{right:12px;display:none}
  #quitter.visible{display:block}
  #retour{left:12px}

  #repli{position:fixed;inset:0;z-index:25;background:var(--fond);display:none}
  #repli.visible{display:block}
  model-viewer{width:100%;height:100%;--poster-color:transparent}

  /* ---- Mobile : le volume en haut, le texte et les deux boutons en
     bas sur fond plein. Les boutons doivent rester atteignables même
     sur un écran court, sinon la page est inutilisable au moment
     précis où elle sert. ---- */
  @media (max-width:760px){
    #accueil .scene{height:40svh;bottom:auto}
    #accueil .hud{display:block;min-height:auto;
      padding:0 var(--marge) calc(22px + env(safe-area-inset-bottom))}
    #accueil .entete{position:fixed;top:0;left:0;right:0;z-index:14;
      padding:12px var(--marge) 10px;
      background:linear-gradient(to bottom,var(--fond) 55%,transparent)}
    #accueil .pied{max-width:none;margin-top:38svh;padding-top:26px;
      background:linear-gradient(to bottom,transparent,var(--fond) 26px)}
    #accueil .enonce{font-size:12.5px;line-height:1.7;margin-bottom:16px;max-width:none}
    .action,.discret{padding:17px;min-height:52px;font-size:13px}
    #etat{font-size:10.5px;padding:13px 16px calc(13px + env(safe-area-inset-bottom))}
    #quitter,#retour{font-size:10.5px;padding:12px 15px;min-height:44px}
  }
  @media (max-width:760px) and (max-height:620px){
    #accueil .scene{height:30svh}
    #accueil .pied{margin-top:28svh}
  }
</style>
</head>
<body>

<script src="../assets/filaire-01.js?v=61"></script>
<script src="../assets/holo.js?v=61"></script>
<script>
  /* ====== LES SEULES DONNÉES À MODIFIER POUR CE PROJET ====== */
  window.PROJET = {
    n:       2,
    titre:   "Titre du projet 02",
    glb:     "../modeles/projet-02.glb",
    mind:    "../cibles/projet-02.mind",
    filaire: FILAIRE_01,        // arêtes extraites du GLB
    graine:  7714029,

    // Pose du modèle sur la vignette.
    //   rotation : 90 le dresse hors de la page, -90 s'il part derrière
    //   echelle  : hauteur voulue (cm) ÷ largeur vignette (cm) ÷ hauteur du modèle
    //   position : reste à 0 si l'origine du modèle est au sol
    rotation: "90 0 0",
    echelle:  "0.6 0.6 0.6",
    position: "0 0 0"
  };
</script>
<script src="../assets/projet.js?v=61"></script>

</body>
</html>

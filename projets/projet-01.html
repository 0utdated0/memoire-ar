<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060E">
<title>01 — Cube de test</title>

<!-- =========================================================
     GABARIT À DUPLIQUER POUR CHAQUE PROJET.
     Cherchez les commentaires « À RENSEIGNER ».
     ========================================================= -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/holo.css">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  html,body{height:100%;overflow:hidden}

  #accueil{
    position:fixed;inset:0;z-index:30;
    display:flex;flex-direction:column;
    padding:var(--marge);
    background:var(--vide);
  }
  #accueil .scene{flex:1;max-height:none;margin:12px 0 4px}
  #accueil h1{font-size:clamp(2.2rem,9vw,3.4rem)}

  #etat{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:16px 20px calc(16px + env(safe-area-inset-bottom));
    background:rgba(5,6,14,.82);
    backdrop-filter:blur(14px);
    border-top:1px solid var(--trait);
    text-align:center;font-size:.86rem;color:var(--encre);
    display:none;
  }
  #etat.visible{display:block}
  #etat b{
    font-family:"Syne",sans-serif;font-weight:600;
    background:linear-gradient(101deg,var(--holo-cyan),var(--holo-rose));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }

  #quitter{
    position:fixed;top:calc(14px + env(safe-area-inset-top));right:14px;z-index:20;
    display:none;cursor:pointer;
    background:rgba(5,6,14,.82);backdrop-filter:blur(14px);
    border:1px solid var(--trait);border-radius:2px;
    color:var(--encre);font-family:"Instrument Sans",sans-serif;font-size:.86rem;
    padding:11px 16px;
  }
  #quitter.visible{display:block}

  #repli{position:fixed;inset:0;z-index:25;background:var(--vide);display:none}
  #repli.visible{display:block}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
  #retour{
    position:fixed;top:calc(14px + env(safe-area-inset-top));left:14px;z-index:26;
    cursor:pointer;background:rgba(5,6,14,.82);backdrop-filter:blur(14px);
    border:1px solid var(--trait);border-radius:2px;
    color:var(--encre);font-family:"Instrument Sans",sans-serif;font-size:.86rem;
    padding:11px 16px;
  }
</style>
</head>
<body>

<!-- ================= ACCUEIL ================= -->
<section id="accueil">
  <div class="bandeau">
    <a href="../index.html">Retour à l'archive</a>
    <span class="rang">01</span>
  </div>

  <div class="scene" id="scene" aria-hidden="true"></div>

  <!-- À RENSEIGNER : titre et consigne -->
  <h1>Cube de test</h1>
  <p class="dit" style="margin:16px 0 26px">
    Autorisez la caméra, puis pointez à nouveau la vignette imprimée.
    Gardez-la dans le cadre, le bâtiment y reste accroché.
  </p>

  <div>
    <button class="action" id="lancer">Lever le bâtiment</button>
    <a class="discret" href="#" id="vers-repli">Le poser dans la pièce à l'échelle réelle</a>
  </div>
</section>

<!-- ================= AR ANCRÉE SUR LA VIGNETTE ================= -->
<!-- À RENSEIGNER : chemins du .mind et du .glb -->
<a-scene
  mindar-image="imageTargetSrc: ../cibles/projet-01.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 10; warmupTolerance: 8; missTolerance: 15"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, antialias: true, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="batiment" src="../modeles/projet-01.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="cible" mindar-image-target="targetIndex: 0">
    <!--
      Repère de la vignette : X vers la droite, Y vers le haut, Z sort du papier.
      Le glTF est en Y-up, d'où la rotation +90 sur X pour le dresser.
      Si le bâtiment part derrière la page, passez à -90.

      scale = hauteur voulue (cm) ÷ largeur vignette (cm) ÷ hauteur du modèle
      position reste à 0 si l'origine du modèle est au sol.
    -->
    <a-gltf-model
      src="#batiment"
      rotation="90 0 0"
      position="0 0 0"
      scale="0.6 0.6 0.6">
    </a-gltf-model>

    <a-light type="ambient" intensity="0.85"></a-light>
    <a-light type="directional" intensity="0.75" position="1 2 1"></a-light>
  </a-entity>
</a-scene>

<div id="etat">Pointez la vignette</div>
<button id="quitter">Fermer</button>

<!-- ================= REPLI : POSE LIBRE ================= -->
<div id="repli">
  <button id="retour">Retour</button>
  <model-viewer
    src="../modeles/projet-01.glb"
    ar
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="fixed"
    camera-controls
    shadow-intensity="1"
    alt="Maquette du premier projet">
  </model-viewer>
</div>

<script src="../assets/holo.js"></script>
<script>
  // Une graine différente par projet donne un volume différent.
  const filaire = holo(document.getElementById('scene'), 4021);

  const accueil = document.getElementById('accueil');
  const etat    = document.getElementById('etat');
  const quitter = document.getElementById('quitter');
  const repli   = document.getElementById('repli');
  const scene   = document.querySelector('a-scene');
  const cible   = document.getElementById('cible');

  // iOS n'ouvre la caméra qu'après un geste : c'est ce clic.
  document.getElementById('lancer').addEventListener('click', async () => {
    accueil.style.display = 'none';
    filaire.arrete();                 // libère le processeur pour le suivi
    etat.classList.add('visible');
    quitter.classList.add('visible');
    try {
      await scene.systems['mindar-image-system'].start();
    } catch (e) {
      etat.innerHTML = "Caméra indisponible. Essayez « le poser dans la pièce ».";
    }
  });

  cible.addEventListener('targetFound', () => { etat.innerHTML = '<b>Ancré</b>'; });
  cible.addEventListener('targetLost',  () => { etat.textContent = 'Pointez la vignette'; });

  quitter.addEventListener('click', () => {
    scene.systems['mindar-image-system'].stop();
    etat.classList.remove('visible');
    quitter.classList.remove('visible');
    accueil.style.display = 'flex';
    filaire.reprend();
  });

  document.getElementById('vers-repli').addEventListener('click', (e) => {
    e.preventDefault();
    repli.classList.add('visible');
    filaire.arrete();
  });
  document.getElementById('retour').addEventListener('click', () => {
    repli.classList.remove('visible');
    filaire.reprend();
  });
</script>

</body>
</html>

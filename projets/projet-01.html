<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<title>01 / Cadastre Vertical</title>

<!-- Tout est construit par assets/projet.js, et toute la mise en forme
     vit dans assets/holo.css. Le SEUL bloc à modifier ici est
     window.PROJET, plus bas. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/holo.css?v=80">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>html,body{height:100%;margin:0;overflow:hidden;background:var(--fond)} .grain{opacity:.06}</style>
</head>
<body>

<script>
  /* ============ LES SEULES DONNÉES À MODIFIER ============ */
  window.PROJET = {
    n:     1,
    titre: "Cadastre Vertical",
    glb:   "../modeles/projet-01.glb",
    // usdz : chemin d'un .usdz si vous en fournissez un. Sans lui,
    // model-viewer en génère un à la volée pour iOS.

    // Le modèle est déjà réduit dans le GLB : il se pose comme une
    // maquette de 20 cm sur une table.
    echelle: "1/5409",

    /* ---- Ancres posées sur la maquette ----
       'p' est une position dans l'espace de la MAQUETTE, en mètres,
       donc comprise entre 0 et 0,20 en hauteur. Les exprimer en
       mètres réels les envoyait à cent mètres au-dessus du modèle,
       où elles étaient invisibles. */
    ancres: [
      { p: "0.0318 0.1939 0.0014", t: "Couronnement", d: "ALT +1081,80" },
      { p: "0.0706 0.1354 0.0014", t: "Façade est", d: "NIV 236 / 343" },
      { p: "-0.0070 0.0828 0.0128", t: "Décrochement", d: "REPRISE DE CHARGE" },
      { p: "0.0318 0.0202 0.0313", t: "Socle technique", d: "NIV 001 → 040" }
    ],

    /* ---- Galerie ----
       Déposez vos images dans photos/projet-01/ en gardant ces noms.
       Une image manquante retire sa vignette au lieu de laisser un
       trou : vous pouvez donc les ajouter une par une. */
    photos: [
      { src: "../photos/projet-01/01.jpg", legende: "Vue d'ensemble" },
      { src: "../photos/projet-01/02.jpg", legende: "Détail de façade" },
      { src: "../photos/projet-01/03.jpg", legende: "Coupe longitudinale" },
      { src: "../photos/projet-01/04.jpg", legende: "Maquette, 1/5409" }
    ],

    /* ---- Relevé technique ---- */
    fiche: [
      ["Hauteur", "1 081,80 m"],
      ["Emprise", "400 × 400 m"],
      ["Niveaux", "343"],
      ["Hauteur d'étage", "3,15 m"],
      ["Structure", "Mégastructure, noyau béton"],
      ["État", "Non bâti"],
      ["Maquette", "1/5409 — 20 cm"],
      ["Modélisation", "Blender, glTF 2.0"]
    ],
    texte: "Ce projet n'a jamais quitté le papier. La maquette que vous posez dans la pièce est une reconstitution à l'échelle d'un bâtiment qui n'existe pas. Sa hauteur a été déduite de la trame de ses fenêtres, hautes de 1,80 m."
  };
</script>
<script src="../assets/projet.js?v=80"></script>

</body>
</html>

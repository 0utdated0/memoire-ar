<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<title>01 / Titre du projet 01</title>

<!-- Tout est construit par assets/projet.js.
     Seul le bloc PROJET ci-dessous est à modifier. -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/holo.css?v=76">
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  html,body{height:100%;margin:0;overflow:hidden;background:var(--fond)}

  model-viewer{
    position:fixed;inset:0;width:100%;height:100%;
    --poster-color:transparent;
    background:transparent;
  }

  .entete-projet{
    position:fixed;top:0;left:0;right:0;z-index:14;
    display:flex;justify-content:space-between;align-items:baseline;
    padding:calc(14px + env(safe-area-inset-top)) var(--marge) 12px;
    font-family:ui-monospace,"SFMono-Regular",monospace;
    font-size:10px;letter-spacing:.06em;color:var(--gris-archive);
    background:linear-gradient(to bottom,var(--fond) 40%,transparent);
  }
  .entete-projet a{color:var(--gris-archive);text-decoration:none}
  .entete-projet a:hover{color:var(--blanc-casse)}

  .bas-projet{
    position:fixed;left:0;right:0;bottom:0;z-index:14;
    padding:26px var(--marge) calc(20px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--fond) 62%,transparent);
    text-align:center;
  }
  .titre-projet{
    margin:0 0 14px;font-family:"Inter",system-ui,sans-serif;
    font-weight:300;font-size:16px;color:var(--blanc-casse);
  }
  .note{
    margin:10px 0 0;font-family:ui-monospace,monospace;
    font-size:10px;letter-spacing:.05em;color:var(--gris-archive);
  }
  .action{
    display:block;width:100%;max-width:420px;margin:0 auto;
    font-family:"Inter",system-ui,sans-serif;font-weight:400;font-size:14px;
    text-align:center;cursor:pointer;border-radius:1px;
    padding:17px;min-height:54px;
    border:1px solid var(--bleu-blueprint);color:var(--blanc-casse);
    background:rgba(3,8,15,.55);
    transition:background .3s ease,color .3s ease;
  }
  .action:hover,.action:focus-visible{background:var(--bleu-blueprint);color:#fff}
  .action.inactif{border-color:var(--beton-clair);color:var(--gris-archive);cursor:default}
  .action.inactif:hover{background:rgba(3,8,15,.55);color:var(--gris-archive)}

  .grain{opacity:.06}

  /* ---- Ancres posées sur la maquette ----
     Un point cyan toujours visible, le libellé au toucher. Tout
     afficher d'emblée rendrait la maquette illisible. */
  .ancre{
    display:block;width:14px;height:14px;padding:0;border:0;
    background:transparent;cursor:pointer;
  }
  .ancre-pt{
    display:block;width:9px;height:9px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 0 3px rgba(56,188,216,.22);
  }
  .ancre-txt{
    position:absolute;left:16px;top:-6px;white-space:nowrap;
    padding:7px 10px;border:1px solid var(--bleu-blueprint);
    background:rgba(3,8,15,.88);backdrop-filter:blur(10px);
    opacity:0;transform:translateX(-4px);pointer-events:none;
    transition:opacity .25s ease,transform .25s ease;
  }
  .ancre.ouverte .ancre-txt{opacity:1;transform:none}
  .ancre-txt b{
    display:block;font-family:"Inter",system-ui,sans-serif;font-weight:400;
    font-size:12px;color:var(--blanc-casse);
  }
  .ancre-txt i{
    display:block;margin-top:3px;font-style:normal;
    font-family:ui-monospace,monospace;font-size:9.5px;
    letter-spacing:.05em;color:var(--gris-archive);
  }
  .ancre[data-visibility-attribute="visible"]:not([data-visible]){opacity:.25}

  /* ---- Relevé technique ---- */
  .lien-fiche{
    display:block;margin:11px auto 0;padding:8px;
    background:none;border:0;cursor:pointer;
    font-family:ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.08em;color:var(--gris-archive);
    text-decoration:underline;text-underline-offset:4px;
  }
  .lien-fiche:hover{color:var(--blanc-casse)}
  .fiche{
    position:fixed;left:0;right:0;bottom:0;z-index:24;
    max-height:82svh;overflow-y:auto;
    padding:26px var(--marge) calc(30px + env(safe-area-inset-bottom));
    background:rgba(3,8,15,.97);backdrop-filter:blur(18px);
    border-top:1px solid var(--bleu-blueprint);
    transform:translateY(102%);transition:transform .45s cubic-bezier(.2,.8,.2,1);
  }
  .fiche.visible{transform:none}
  .fiche h2{
    margin:0 0 18px;font-family:"Inter",system-ui,sans-serif;
    font-weight:200;font-size:21px;color:var(--blanc-casse);
  }
  .fiche dl{
    display:grid;grid-template-columns:auto 1fr;gap:0;margin:0;
    font-family:ui-monospace,monospace;font-size:11px;letter-spacing:.04em;
  }
  .fiche dt{
    padding:9px 16px 9px 0;color:var(--gris-archive);
    border-top:1px solid var(--beton-clair);white-space:nowrap;
  }
  .fiche dd{
    margin:0;padding:9px 0;text-align:right;color:var(--blanc-casse);
    border-top:1px solid var(--beton-clair);
  }
  .fiche-texte{
    margin:20px 0 0;font-family:"Inter",system-ui,sans-serif;
    font-weight:300;font-size:13px;line-height:1.75;color:var(--gris-archive);
  }
  .ferme-fiche{
    float:right;background:none;border:0;cursor:pointer;
    font-family:ui-monospace,monospace;font-size:10.5px;
    letter-spacing:.06em;color:var(--gris-archive);padding:4px 0 4px 12px;
  }
  .ferme-fiche:hover{color:var(--blanc-casse)}
</style>
</head>
<body>

<script>
  /* ====== LES SEULES DONNÉES À MODIFIER ====== */
  window.PROJET = {
    n:     1,
    titre: "Titre du projet 01",
    glb:   "../modeles/projet-01.glb",

    // Le modèle est réduit au 1/5409 dans le GLB : il se pose comme
    // une maquette de 20 cm sur une table, et non comme une tour de
    // 200 m au milieu de la pièce.
    echelle: "1/5409",

    // usdz : chemin d'un .usdz si vous en fournissez un. Sans lui,
    // model-viewer en génère un à la volée pour iOS.

    /* ---- Ancres posées sur la maquette ----
       'p' est une position dans le repère du modèle, en mètres et
       avant mise à l'échelle. Le point apparaît là, le libellé
       s'ouvre au toucher. */
    ancres: [
      { p: "0 195 0",    t: "Couronnement",    d: "ALT +1081.80" },
      { p: "28 140 0",   t: "Façade est",      d: "NIV 236 / 343" },
      { p: "-30 95 10",  t: "Décrochement",    d: "REPRISE DE CHARGE" },
      { p: "0 45 32",    t: "Socle technique", d: "NIV 001 \u2192 040" },
      { p: "25 8 -25",   t: "Emprise au sol",  d: "400 \u00d7 400 m" }
    ],

    /* ---- Relevé technique, ouvert par le lien du bas ---- */
    fiche: [
      ["Hauteur",       "1 081,80 m"],
      ["Emprise",       "400 \u00d7 400 m"],
      ["Niveaux",       "343"],
      ["Hauteur d'\u00e9tage", "3,15 m"],
      ["Structure",     "M\u00e9gastructure, noyau b\u00e9ton"],
      ["\u00c9tat",    "Non b\u00e2ti"],
      ["Maquette",      "1/5409 \u2014 20 cm"],
      ["Mod\u00e9lisation", "Blender, glTF 2.0"]
    ],
    texte: "Ce projet n'a jamais quitt\u00e9 le papier. La maquette que vous "
         + "posez dans la pi\u00e8ce est une reconstitution \u00e0 "
         + "l'\u00e9chelle d'un b\u00e2timent qui n'existe pas."
  };
</script>
<script src="../assets/projet.js?v=76"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#03080f">
<title>01 / Cube de test</title>

<!-- GABARIT À DUPLIQUER. Cherchez « À RENSEIGNER ». -->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/holo.css?v=47">

<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>

<style>
  html,body{height:100%;overflow:hidden}
  #accueil{position:fixed;inset:0;z-index:10}

  #etat{
    position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
    padding:15px 20px calc(15px + env(safe-area-inset-bottom));
    background:rgba(0,0,0,.78);backdrop-filter:blur(12px);
    border-top:1px solid var(--trait);
    text-align:center;font-size:11px;letter-spacing:.06em;color:var(--lisible);
  }
  #etat.visible{display:block}
  #etat b{color:var(--vif);font-weight:400}

  #quitter,#retour{
    position:fixed;top:calc(12px + env(safe-area-inset-top));z-index:26;
    cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.05em;
    background:rgba(0,0,0,.78);backdrop-filter:blur(12px);
    border:1px solid var(--trait);border-radius:1px;
    color:var(--lisible);padding:10px 15px;
  }
  #quitter{right:12px;display:none}
  #quitter.visible{display:block}
  #retour{left:12px}

  #repli{position:fixed;inset:0;z-index:25;background:var(--noir-doux);display:none}
  #repli.visible{display:block}
  model-viewer{width:100%;height:100%;--poster-color:transparent}
</style>
</head>
<body>

<!-- ================= ACCUEIL ================= -->
<section id="accueil">
  <div class="scene" id="scene" aria-hidden="true"></div>
  <div class="vignettage" aria-hidden="true"></div>
  <div class="lueur" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="cadre" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="invite" id="invite" aria-hidden="true">GLISSER POUR ORBITER · HAUT, BAS, AUTOUR</div>

  <div class="releve g" aria-hidden="true">
    PRJ 01<br>REL 4.62.11<br>NIV 08 / 08<br>ÉTAT NON BÂTI
  </div>

  <main class="hud">
    <div class="entete">
      <a href="../index.html">← Archive</a>
      <span class="meta">01</span>
    </div>

    <div class="pied">
      <!-- À RENSEIGNER : titre et consigne -->
      <p class="enonce">
        <b>Cube de test.</b><br>
        Autorisez la caméra, puis pointez à nouveau la vignette imprimée.
        Gardez-la dans le cadre : le bâtiment y reste accroché.
      </p>
      <button class="action" id="lancer">Lever le bâtiment</button>
      <a class="discret" href="#" id="vers-repli">Le poser dans la pièce à l'échelle réelle</a>
    </div>
  </main>
</section>

<!-- ================= AR ANCRÉE SUR LA VIGNETTE ================= -->
<!-- À RENSEIGNER : chemins du .mind et du .glb -->
<a-scene
  mindar-image="imageTargetSrc: ../cibles/projet-01.mind; autoStart: false; uiLoading: no; uiError: no; uiScanning: no; filterMinCF: 0.0001; filterBeta: 10; warmupTolerance: 8; missTolerance: 15"
  color-space="sRGB"
  renderer="colorManagement: true, physicallyCorrectLights, antialias: true, alpha: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <a-assets>
    <a-asset-item id="batiment" src="../modeles/projet-01.glb"></a-asset-item>
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity id="cible" mindar-image-target="targetIndex: 0">
    <!-- rotation 90 dresse le modèle hors de la page ; -90 s'il part derrière.
         scale = hauteur voulue (cm) ÷ largeur vignette (cm) ÷ hauteur du modèle
         position reste à 0 si l'origine du modèle est au sol. -->
    <a-gltf-model src="#batiment" rotation="90 0 0" position="0 0 0" scale="0.6 0.6 0.6"></a-gltf-model>
    <a-light type="ambient" intensity="0.85"></a-light>
    <a-light type="directional" intensity="0.75" position="1 2 1"></a-light>
  </a-entity>
</a-scene>

<div id="etat">Pointez la vignette</div>
<button id="quitter">Fermer</button>

<!-- ================= REPLI : POSE LIBRE ================= -->
<div id="repli">
  <button id="retour">← Retour</button>
  <model-viewer src="../modeles/projet-01.glb" ar
    ar-modes="webxr scene-viewer quick-look" ar-scale="fixed"
    camera-controls shadow-intensity="1" alt="Maquette du premier projet"></model-viewer>
</div>

<script src="../assets/filaire-01.js?v=47"></script>
<script src="../assets/holo.js?v=47"></script>
<script>
  // Une graine différente par projet donne un volume différent.
  const filaire = holo(document.getElementById('scene'), 4021);
  const inv = document.getElementById('invite');
  addEventListener('pointerdown', () => inv && inv.classList.add('parti'), { once:true });

  const accueil = document.getElementById('accueil');
  const etat    = document.getElementById('etat');
  const quitter = document.getElementById('quitter');
  const repli   = document.getElementById('repli');
  const scene   = document.querySelector('a-scene');
  const cible   = document.getElementById('cible');

  // iOS n'ouvre la caméra qu'après un geste : c'est ce clic.
  document.getElementById('lancer').addEventListener('click', async () => {
    accueil.style.display = 'none';
    filaire.arrete();                 // libère le processeur pour le suivi
    etat.classList.add('visible');
    quitter.classList.add('visible');
    try {
      await scene.systems['mindar-image-system'].start();
    } catch (e) {
      etat.innerHTML = "Caméra indisponible. Essayez « le poser dans la pièce ».";
    }
  });

  cible.addEventListener('targetFound', () => { etat.innerHTML = '<b>ANCRÉ</b>'; });
  cible.addEventListener('targetLost',  () => { etat.textContent = 'Pointez la vignette'; });

  quitter.addEventListener('click', () => {
    scene.systems['mindar-image-system'].stop();
    etat.classList.remove('visible');
    quitter.classList.remove('visible');
    accueil.style.display = 'block';
    filaire.reprend();
  });

  document.getElementById('vers-repli').addEventListener('click', (e) => {
    e.preventDefault();
    repli.classList.add('visible');
    filaire.arrete();
  });
  document.getElementById('retour').addEventListener('click', () => {
    repli.classList.remove('visible');
    filaire.reprend();
  });
</script>

</body>
</html>
